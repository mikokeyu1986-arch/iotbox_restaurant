# Redsys payment terminal configuration.
#
# This is the template ships with the installer; it is copied to config.yaml on
# first install and is never overwritten afterwards.  Fill in the merchant
# credentials for this installation -- either here or in the GUI's Redsys tab,
# which writes the same keys back into config.yaml.
#
# The credentials are deliberately empty: config.yaml holds a live payment
# signing key and is git-ignored, so this file must not carry one.
app:
  simulate: 'false'
  log:
    level: 'INFO'
  http:
    host: '127.0.0.1'
    port: '6971'
connect:
  comercio: ''
  terminal: '1'
  clave_firma: ''
  puerto: 'COM9'
  version: '6.1'
odoo:
  create_url: 'http://127.0.0.1:8070/pos_dataphone_operation/create'
bridge:
  powershell_path: 'Py310Host.exe'
  script_path: 'server/redsys_server/bridge/redsys_py310_bridge.py'
  dll_path: 'lib/dllTpvpcLatente.dll'
  runtime_dir: ''
  dependency_dirs: 'C:/Program Files (x86)/REDSYS/TpvpcWinService;C:/Program Files (x86)/TpvpcImplantado'
  timeout_seconds: 120
  log_path: 'data/bridge.log'
