name: Build IOTBOX installer

# PyInstaller is not a cross-compiler and Inno Setup is a Windows program, so
# the Windows installer can only be produced on Windows.  This runs the same
# build_installer.ps1 that is used by hand, on a Windows runner, and publishes
# the resulting setup executable.

on:
  workflow_dispatch:
  push:
    tags:
      - "v*"

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v7

      # 3.11 matches the interpreter the installer has been built with so far.
      - uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          # Installs the Windows-only extras too (pywin32, pystray, pywebview),
          # because their platform markers are active on this runner.
          python -m pip install -e .
          python -m pip install pyinstaller

      - name: Verify the build dependencies the script checks for
        run: |
          python -c "import pystray, PIL, webview; print('GUI dependencies OK')"

      - name: Install Inno Setup 6
        run: choco install innosetup --no-progress -y

      # certs/ and runtime_config.json are git-ignored -- the first holds the
      # box's private key, the second its Odoo pairing token -- but the build
      # hands both to PyInstaller with --add-data, which fails outright when
      # they are missing.  The real files are generated on the box itself: the
      # certificates at first start, the configuration when it is paired.
      - name: Create the ignored build inputs
        shell: pwsh
        run: |
          foreach ($dir in @("certs", "release")) {
            if (-not (Test-Path $dir)) { New-Item -ItemType Directory -Path $dir | Out-Null }
          }
          if (-not (Test-Path runtime_config.json)) {
            Copy-Item runtime_config.example.json runtime_config.json
          }
          Get-ChildItem certs, runtime_config.json | Select-Object Name, Length

      - name: Build the installer
        shell: pwsh
        run: ./build_installer.ps1

      - name: Upload the installer
        uses: actions/upload-artifact@v7
        with:
          name: IOTBOX-SETUP
          # The installer is named from OutputBaseFilename in IOTBOX.iss, which
          # carries the version (IOTBOX-SETUP-2026.08.21.exe) -- glob it so a
          # version bump does not silently break the upload.
          path: release/*.exe
          if-no-files-found: error
          retention-days: 30
