[project]
name = "custom-iot-box-runtime"
version = "2026.8.3"
description = "Self-hosted IoT Box runtime compatible with Odoo POS IoT APIs"
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn[standard]>=0.35.0",
    "websockets>=15.0,<16.0",
    "pydantic>=2.0.0",
    "Pillow>=10.0.0",
    "CairoSVG>=2.7.0",
    "qrcode>=8.0",
    "cryptography>=44.0.0",
    "pyserial>=3.5",
    "pywin32>=308; platform_system == 'Windows'",
    "pystray>=0.19.5; platform_system == 'Windows'",
    "pywebview>=5.0; platform_system == 'Windows'",
]

[build-system]
requires = ["setuptools>=65", "wheel"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["app", "app.*"]
