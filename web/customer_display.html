<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Customer Display</title>
<style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:#0f172a;color:#f8fafc;font-family:"Segoe UI",Arial,sans-serif}main{min-height:100vh;padding:4vh 6vw;display:flex;flex-direction:column}.header{display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #334155;padding-bottom:2vh}.brand{font-size:clamp(24px,3vw,48px);font-weight:700}.state{font-size:clamp(16px,1.5vw,24px);color:#94a3b8}.content{flex:1;display:grid;grid-template-columns:minmax(0,1fr) minmax(260px,.45fr);gap:5vw;padding:3vh 0}.lines{overflow:auto}.line{display:grid;grid-template-columns:minmax(0,1fr) auto;gap:1vw;padding:1.8vh 1vw;border-bottom:1px solid #273449;font-size:clamp(19px,2.1vw,34px)}.line.selected{background:#1e3a5f;border-radius:10px}.product{font-weight:650}.meta,.note{font-size:.72em;color:#cbd5e1;margin-top:.35em}.price{text-align:right;white-space:nowrap}.summary{border-left:1px solid #334155;padding-left:3vw;display:flex;flex-direction:column;gap:1.25vh;font-size:clamp(19px,2vw,32px)}.summary-row{display:flex;justify-content:space-between;gap:1vw}.total{font-weight:800;font-size:1.4em;color:#67e8f9;border-top:2px solid #475569;margin-top:1vh;padding-top:1.5vh}.payment{font-size:.85em;color:#e2e8f0}.change{color:#86efac;font-weight:700}.footer{min-height:7vh;color:#cbd5e1;font-size:clamp(16px,1.6vw,25px);text-align:center}.empty{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:5vh;text-align:center;font-size:clamp(30px,5vw,80px);color:#f8fafc}.welcome-logo{max-width:min(46vw,520px);max-height:35vh;object-fit:contain}.hidden{display:none}
</style></head><body><main><header class="header"><div class="brand">Customer Display</div><div class="state" id="state">Ready</div></header><section class="empty" id="empty"><img class="welcome-logo" src="/customer-display/logo" alt="Company logo"><strong>¡Bienvenido/a!</strong></section><section class="content hidden" id="order"><div class="lines" id="lines"></div><aside class="summary" id="summary"></aside></section><footer class="footer" id="footer"></footer></main>
<script>
let revision=-1,returnToWelcomeTimer=null;const $=s=>document.querySelector(s);const esc=v=>String(v??'').replace(/[&<>'"]/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;',"'":'&#39;','"':'&quot;'}[c]));
function reset(){ $('#state').textContent='Ready';$('#empty').innerHTML='<img class="welcome-logo" src="/customer-display/logo" alt="Company logo"><strong>¡Bienvenido/a!</strong>';$('#empty').classList.remove('hidden');$('#order').classList.add('hidden');$('#footer').textContent=''; }
function showNewestLine(){const list=$('#lines');const target=list.querySelector('.selected')||list.lastElementChild;if(target)target.scrollIntoView({block:'nearest',behavior:'smooth'});}
function render(data){if(!data||!Object.keys(data).length){reset();return}if(returnToWelcomeTimer){clearTimeout(returnToWelcomeTimer);returnToWelcomeTimer=null}const lines=Array.isArray(data.lines)?data.lines:[];if(!lines.length&&!data.finalized){reset();return}const isNative=lines.some(l=>'productName'in l);if(!isNative){renderFallback(data);return}$('#empty').classList.add('hidden');$('#order').classList.remove('hidden');$('#state').textContent=data.finalized?'Payment complete':'Current order';$('#lines').innerHTML=lines.map(line=>`<article class="line ${line.isSelected?'selected':''}"><div><div class="product">${esc(line.productName)}</div><div class="meta">${esc(line.qty)} ${esc(line.unit)}${line.unitPrice?' × '+esc(line.unitPrice):''}${line.discount?' · '+esc(line.discount):''}</div>${line.customerNote?`<div class="note">${esc(line.customerNote)}</div>`:''}</div><div class="price">${esc(line.price)}</div></article>`).join('');showNewestLine();const rows=[];if(data.subtotal)rows.push(['Subtotal',data.subtotal]);if(data.amountTaxes)rows.push(['Taxes',data.amountTaxes]);rows.push(['Total',data.amount||'']);(data.paymentLines||[]).forEach(p=>rows.push([esc(p.name),esc(p.amount),'payment']));if(data.change)rows.push(['Change',data.change,'change']);$('#summary').innerHTML=rows.map(r=>`<div class="summary-row ${r[2]||''}"><span>${r[0]}</span><strong>${r[1]}</strong></div>`).join('');$('#footer').textContent=data.general_customer_note||'';if(data.finalized)returnToWelcomeTimer=setTimeout(reset,5000);}
function renderFallback(data){const lines=Array.isArray(data.lines)?data.lines:[];if(!lines.length&&data.text){reset();return}$('#empty').classList.add('hidden');$('#order').classList.remove('hidden');$('#state').textContent=data.finalized?'Payment complete':'Current order';$('#lines').innerHTML=lines.map(x=>`<article class="line"><div class="product">${esc(x.name||x.product_name||x.display_name||'')}</div><div class="price">${esc(x.total??x.price??'')}</div></article>`).join('');$('#summary').innerHTML=`<div class="summary-row total"><span>Total</span><strong>${esc(data.amount??data.total??'')}</strong></div>`;$('#footer').textContent=data.general_customer_note||data.message||'';}
async function refresh(){try{const state=await fetch('/customer-display/state',{cache:'no-store'}).then(r=>r.json());if(state.revision!==revision){revision=state.revision;render(state.payload)}}catch(_){}}reset();refresh();setInterval(refresh,350);
</script></body></html>
